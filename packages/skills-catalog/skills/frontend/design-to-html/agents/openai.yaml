interface:
  display_name: "Design to HTML"
  short_description: "Mock de UI → HTML/CSS/JS estático em etapas, ou wireframe ASCII/SVG tipado"
  default_prompt: "Use $design-to-html: recrie este mock em index.html + assets/styles.css seguindo wireframe ASCII com plano → fundo completo (CSS e/ou imagens) → componentes com fontes → assets restantes → revisão final, parando para aprovação em cada etapa aplicável."
policy:
  allow_implicit_invocation: false
