# Fecha PRs vindos de forks. Uso do código continua livre (Apache-2.0).
# pull_request_target roda no repo base com permissão de fechar o PR;
# não faz checkout do código do fork.

name: close-external-contributions

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  close:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Obrigado pelo interesse.',
              '',
              'Este repositório está sob **Apache License 2.0**: você pode usar, copiar e modificar o código sem pedir permissão.',
              '**Contribuições externas ainda não são aceitas.** Issues estão desativadas; PRs de forks são encerrados automaticamente.',
              '',
              'Detalhes em `CONTRIBUTING.md`.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed',
            });
