name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Validate skills
        run: pnpm validate:skills

      - name: Scan skills
        run: pnpm scan:skills

      - name: Compile catalog
        run: pnpm compile:catalog
